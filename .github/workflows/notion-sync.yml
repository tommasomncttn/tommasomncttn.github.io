name: Sync Notion Blog Posts

on:
  schedule:
    - cron: "0 5 * * *" # daily, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to dispatch the deploy workflow after committing

jobs:
  notion-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # See CUSTOMIZE.md for details on how to set up PAT so this commit
      # also triggers the deploy workflow:
      #        with:
      #          token: ${{ secrets.PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Sync posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DATABASE_ID" ]; then
            echo "⚠️ NOTION_TOKEN / NOTION_DATABASE_ID secrets not configured — skipping." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          python _scripts/notion_sync.py

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        id: commit
        run: |
          git add _posts assets/img/posts
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "📤 Committing synced posts..."
            git commit -m "Sync blog posts from Notion"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Commits made with GITHUB_TOKEN don't fire push-triggered workflows,
      # so dispatch the deploy explicitly when the sync changed something.
      - name: Trigger site deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R ${{ github.repository }}
